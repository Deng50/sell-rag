[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sell-rag"
version = "1.0.0"
description = "Local-first multimodal RAG service for smart vending terminals"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jieba>=0.42,<1",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "zhipuai>=2.1,<3",
]

[project.optional-dependencies]
document = ["docling>=2.15,<3", "pypdf>=5,<6", "python-docx>=1.1,<2"]
retrieval = [
  "faiss-cpu>=1.9,<2",
  "sentence-transformers>=3.3,<4",
  "torch>=2.4,<3",
]
audio = ["pyaudio>=0.2.14,<1", "webrtcvad-wheels>=2.0.14,<3", "sounddevice>=0.5,<1"]
vision = ["opencv-python>=4.10,<5", "ultralytics>=8.3,<9"]
ui = ["PyQt5>=5.15,<6"]
eval = ["ragas>=0.2,<1"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "pytest-qt>=4.4,<5", "ruff>=0.8,<1"]
all = [
  "docling>=2.15,<3", "pypdf>=5,<6", "python-docx>=1.1,<2",
  "faiss-cpu>=1.9,<2", "sentence-transformers>=3.3,<4", "torch>=2.4,<3",
  "pyaudio>=0.2.14,<1", "webrtcvad-wheels>=2.0.14,<3", "sounddevice>=0.5,<1",
  "opencv-python>=4.10,<5", "ultralytics>=8.3,<9", "PyQt5>=5.15,<6",
  "ragas>=0.2,<1", "pytest>=8,<9", "pytest-cov>=5,<7", "pytest-qt>=4.4,<5",
  "ruff>=0.8,<1",
]

[project.scripts]
sell-rag = "sell_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: requires external services or downloaded models", "ui: requires PyQt5"]

[tool.ruff]
line-length = 100
target-version = "py311"
